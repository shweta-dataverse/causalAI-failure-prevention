# every path, grid, budget, seed and threshold of the pipeline and the evaluation.
# paths are relative to the repository root.

paths:
  raw: data/raw/causRCA
  processed: data/processed
  cache: data/cache                       # discovery_study/, scm/ and lstm/ below it
  outputs: outputs                        # pipeline/ and evaluation/, each with tables/ and figures/
  log_file: logs/run.log
  related_recordings: config/related_recordings.csv   # frozen near-duplicate groups

subsystems: [coolant, probe]              # analysed subsystems
graphs: [expert, discovered]

# event logs -> state tables and model views
preprocessing:
  raw_dir: data/raw/causRCA
  output_dir: data/processed
  report_dir: data/processed/reports
  sampling_interval_s: 1.0                # archival state table
  sensitivity_intervals_s: [0.1, 0.25, 0.5, 1.0, 2.0, 5.0]
  duplicate_policy: last                  # same (recording, node, time_s): last | first | error
  strict_binary: true                     # reject binary/alarm values other than true/false/1/0
  counter_first_differences: false

# state views <subsystem>_dt<interval> in data/processed: a schema view encodes the expert node
# list without any fitted step; the fitted 1 s coolant view serves the sensitivity analysis
state_views:
  - {subsystem: coolant, interval_s: 0.5, encoding: schema}
  - {subsystem: probe, interval_s: 0.5, encoding: schema}
  - {subsystem: coolant, interval_s: 1.0, encoding: fitted}
manipulated_kinds:                        # wording of the subsystem table
  coolant: pumps, filters, tank levels
  probe: arm position sensors

model_interval_s: 0.5                     # grid of the model views <subsystem>_dt0.5
split_fractions: [0.7, 0.15, 0.15]        # normal recordings by number: train, validation, test

# preprocessing example of the setup chapter
example:
  recording: coolant_exp_22_run_1
  source_file: dig_twin/exp_coolant/exp_22/run_1/faultDataset_coolant_exp22_run_1.csv
  fold: exp_22
  steps: 5

# regime-wise pcmci+ and the selection of the discovery settings per scope
discovery:
  # original fixed configuration (kept as the comparison)
  original:
    ci_test: gsq
    interval_s: 0.5
    tau_max_s: 10.0
    pc_alpha: 0.01
    max_conds: [3, 3, 3]                  # max_conds_dim, max_conds_px, max_conds_py
    fdr_method: fdr_bh
    apply_fdr_to_graph: true
    support_threshold: 0.5
  # 27 configurations, 9 pcmci+ runs per regime (the support threshold only aggregates)
  grid:
    pc_alpha: [0.001, 0.01, 0.05]
    tau_max_s: [5.0, 10.0, 20.0]
    support_threshold: [0.25, 0.5, 0.75]
    fixed:
      ci_test: gsq
      interval_s: 0.5
      max_conds: [3, 3, 3]
      fdr_method: fdr_bh
      apply_fdr_to_graph: true
  # lexicographic order against the expert graph, first entry decides first
  selection:
    order:
      - directed_f1: max
      - skeleton_f1: max
      - tau_max_s: min
      - pc_alpha: min
      - support_threshold: max
      - config_id: min
  min_changes: 1                          # a regime uses variables that change at least this often
  # staged comparisons on the shortlist
  shortlist:
    size: 3                               # top configurations on all scenarios, plus the original
    conditioning_caps: [2, 4]
    caps_for: [selected, original]
    long_lag_s: 60.0
    long_lag_for: [selected, original]
    run_timeout_s: 10800
    alternative_ci_test:
      test: cmisymb
      sig_samples: 200
      seed: 0
      for: [selected]
      regimes: fault                      # the normal regime is infeasible with cmisymb
  bootstrap:
    n_boot: 20
    seed: 0
  timing:
    max_lag_steps: 120
    bins:                                 # name: [first lag, last lag] in steps
      lag0: [0, 0]
      0.5-10s: [1, 20]
      10.5-20s: [21, 40]
      20.5-60s: [41, 120]
  runtime:
    workers: 9                            # parallel regime runs (separate processes)

graph_evaluation:
  random_draws: 2000                      # random graphs with the same number of edges
  seed: 0
  stable_edge_share: 0.95                 # an edge is stable when it appears in this share of bootstrap draws
  missed_edges_for: [coolant]             # subsystems whose missed expert edges are traced

# scm settings: smoothing pseudo-count x extra lag, chosen by held-out one-step log loss
scm:
  alphas: [0.01, 0.1, 0.5, 1.0]
  lags: [null, 2, 4]                      # extra lag in steps; null = first order
  baseline: {alpha: 0.5, lag: null}       # first tie-break
  max_table_features: 20                  # extra lag only on edges whose child keeps <= 2^20 configurations
  normal_refits: 10                       # bootstrap refits of the all-scenario expert model
  seed: 0
  behaviour_samples: 20                   # simulated runs per normal test recording (simulated behaviour)
  abduction_samples: 20                   # replays of the abducted noise without an action
  residual_seed: 0                        # randomized quantile residuals
  diagnostics_subsystem: coolant          # residuals and simulated behaviour of its normal-prediction model
  # appendix study: selection objective of the scm settings
  objective_study:
    objectives: [log_loss, ap3]
    graphs: [expert, discovered, empty]
    metrics: [top1, hit@3, ap@3, rr]
    table_subsystem: probe                # subsystem of the per-scenario table

rca:
  window_before_s: 60.0                   # before the first observed alarm onset
  window_after_s: 5.0                     # after the last observed alarm onset
  top_k: 3
  chance_draws: 2000
  bootstrap_draws: 2000                   # percentile interval of run means
  seed: 0

interventions:
  subsystem: coolant                      # actionability is defined for the coolant variables only
  replay_worlds: 200
  seed: 0

counterfactuals:
  subsystem: coolant
  selection_worlds: 200
  selection_seed: 0
  top_k: 3
  max_actions: 3
  validity_threshold: 0.9
  independent_batches: 10                 # 10 x 200 = 2,000 fresh worlds per selected action set
  independent_batch_size: 200
  independent_entropy: 20261109           # separate stream, never used during selection
  refits_per_fold: 5                      # bootstrap refits of the fold training data
  refit_sample_seed: 100                  # draw b uses seed 100 + b
  refit_world_seed: 1000                  # draw b uses seed 1000 + b
  # validity of do(HP_Pump_Ok = 1) in exp_22 under four scm settings
  settings_check:
    fold: exp_22
    alarm: HP_A_700304
    action: HP_Pump_Ok
    worlds: 2000
    persistence_seed: 7
    settings:                             # [alpha, extra lag, label]
      - [0.5, null, original]
      - [0.01, null, pseudo-count only]
      - [0.5, 2, extra lag only]
      - [0.01, 2, selected]
  # plain names used in the recommendation and example tables
  component_names:
    HP_Pump_Ok: high-pressure pump
    CLF_Filter_Ok: coolant filter
    LP_Pump_Ok: low-pressure pump
    F_Filter_Ok: fleece filter
    LT_Level_Ok: lifting-tank level
    CLT_Level_lt_Min: coolant tank level
    LP_Pump_On: low-pressure pump command
  alarm_names:
    HP_A_700304: pump alarm
  # the three example runs, chosen by a fixed rule
  examples:
    success:
      title: valid run with the highest alarm coverage
      limitation: Prevention is predicted by the SCM, not observed
    lowest_coverage:
      title: lowest alarm coverage
      limitation: No action set met the threshold within the evaluated search; the level fault cannot reach the pump alarm
    lowest_validity:
      title: lowest validity
      limitation: The latched pump alarm is nearly impossible under the SCM of the fold

# lstm + shap baseline
lstm:
  hidden: [32, 64, 128]
  lookback_steps: [20, 40]
  seeds: [0, 1, 2]
  max_epochs: 30
  patience: 2
  min_improvement: 1.0e-6
  learning_rate: 1.0e-3
  batch_size: 512
  shap_background: 100                    # normal training windows
  shap_background_seed: 0
  shap_samples: 50
  step_variants: {top10: 10, top20: 20, all: null}   # explained anomalous steps
  aggregations: [abs, pos]
  main: [top20, abs]                      # fixed in advance
  sensitivity_subsystem: probe            # subsystem of the sensitivity table and the graph/settings decomposition
  workers: 4
  threads_per_worker: 3

# figures that show one run
figure_examples:
  coolant_run: coolant_exp_22_run_1
  coolant_fold: exp_22
  probe_fold: exp_1                       # first run of this scenario, seed 0

# near-duplicate check of the raw recordings
near_duplicates:
  jaccard_threshold: 0.9
  min_events: 5

# appendix comparisons: original configuration and no near-duplicate exclusion
comparisons:
  # rows of the original/selected table per subsystem, in printed order
  original_rows:
    coolant: [directed_f1, normal_change_log_loss, fault_log_loss, fault_change_log_loss, map, activation_error,
              valid_recommendations, mean_validity, lowest_refit_validity]
    probe: [directed_f1_scm_edges, normal_change_log_loss, fault_change_log_loss, top1, map, scenario_ap]
