[project]
name = "causal-rca"
version = "0.1.0"
description = "Causal discovery, root cause analysis and counterfactual explanations on the causRCA benchmark."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "pyarrow>=15",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "tigramite==5.2.10.1",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "torch>=2.4",
    "shap>=0.46",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that need the raw causRCA dataset under data/raw/causRCA",
]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["src", "scripts", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
